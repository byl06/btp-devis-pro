<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BTP Devis Pro - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1E3A8A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <!-- Bouton menu mobile -->
    <button class="mobile-menu-btn" onclick="toggleMobileMenu()" style="position: fixed; top: 15px; left: 15px; z-index: 1001; background: rgba(15,23,42,0.9); border: none; color: white; padding: 12px; border-radius: 10px; cursor: pointer;">
        <i class="fas fa-bars"></i>
    </button>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-hard-hat"></i>
                <span>BTP Devis Pro</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-page="dashboard">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-page="devis">
                    <i class="fas fa-file-invoice"></i>
                    <span>Devis</span>
                </a>
                <a href="#" class="nav-item" data-page="clients">
                    <i class="fas fa-users"></i>
                    <span>Clients</span>
                </a>
                <a href="#" class="nav-item" data-page="projets">
                    <i class="fas fa-building"></i>
                    <span>Projets</span>
                </a>
                <a href="#" class="nav-item" data-page="factures">
                    <i class="fas fa-receipt"></i>
                    <span>Factures</span>
                </a>
                <a href="#" class="nav-item" data-page="parametres">
                    <i class="fas fa-cog"></i>
                    <span>Paramètres</span>
                </a>
            </nav>
            <div class="user-info">
                <div>
                    <p class="user-name" id="user-name">Chargement...</p>
                    <p class="user-email" id="user-email"></p>
                </div>
                <button class="logout-btn" onclick="app.logout()">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <header class="glass-header">
                <h1 id="page-title">Dashboard</h1>
                <div class="header-right">
                    <!-- Langue supprimée -->
                </div>
            </header>
            <div class="content-area" id="content-area">
                <div class="loading">Chargement...</div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Fonction pour le menu mobile
        function toggleMobileMenu() {
            const sidebar = document.querySelector('.sidebar');
            if (sidebar) {
                sidebar.classList.toggle('open');
            }
        }

        // Fermer le menu quand on clique ailleurs (mobile)
        document.addEventListener('click', function(e) {
            const sidebar = document.querySelector('.sidebar');
            const menuBtn = document.querySelector('.mobile-menu-btn');
            if (window.innerWidth <= 768) {
                if (sidebar && menuBtn && !sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
                    sidebar.classList.remove('open');
                }
            }
        });
    </script>

    <!-- Menu hamburger pour mobile -->
<script>
(function() {
    // Créer l'overlay
    const overlay = document.createElement('div');
    overlay.className = 'sidebar-overlay';
    document.body.appendChild(overlay);
    
    // Fonction pour ouvrir/fermer le menu
    window.toggleMobileMenu = function() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        if (sidebar) {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }
    };
    
    // Fermer le menu quand on clique sur l'overlay
    overlay.addEventListener('click', function() {
        const sidebar = document.querySelector('.sidebar');
        if (sidebar) {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }
    });
    
    // Fermer le menu quand on clique sur un lien (navigation)
    document.addEventListener('click', function(e) {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        const menuBtn = document.querySelector('.mobile-menu-btn');
        
        if (window.innerWidth <= 768 && sidebar && sidebar.classList.contains('open')) {
            // Si on clique sur un lien dans le menu
            if (e.target.closest('.nav-item')) {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            }
        }
    });
    
    // Reinitialiser le menu quand la fenêtre redimensionne
    window.addEventListener('resize', function() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        if (window.innerWidth > 768 && sidebar) {
            sidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('active');
        }
    });
})();
</script>
</body>
</html>
