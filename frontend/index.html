<!-- BANNIÈRE DE COOKIES                                           -->
<!-- ============================================================ -->
<div id="cookie-banner" style="
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #0A1712;
    color: white;
    padding: 16px 24px;
    z-index: 9999;
    display: none;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    border-top: 2px solid #34D399;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
">
    <div style="flex: 1; font-size: 0.9rem; min-width: 200px;">
        <span style="font-weight: bold;">🍪 Nous utilisons des cookies</span>
        <span style="color: #94A3B8; margin-left: 8px;">
            pour améliorer votre expérience, sécuriser votre session et analyser l'utilisation de l'application.
        </span>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
        <button onclick="accepterCookies()" style="
            background: #34D399;
            border: none;
            color: #0A1712;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        " onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
            Accepter
        </button>
        <button onclick="refuserCookies()" style="
            background: transparent;
            border: 1px solid #475569;
            color: #94A3B8;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        " onmouseover="this.style.borderColor='#34D399'; this.style.color='#34D399'" onmouseout="this.style.borderColor='#475569'; this.style.color='#94A3B8'">
            Refuser
        </button>
        <a href="https://btpdevispro-info.netlify.app/politique-confidentialite.html" target="_blank" style="
            color: #34D399;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background 0.2s;
        " onmouseover="this.style.background='rgba(52,211,153,0.1)'" onmouseout="this.style.background='transparent'">
            En savoir plus →
        </a>
    </div>
</div>

<script>
// ============================================================
// GESTION DES COOKIES — VERSION AVEC RELOAD
// ============================================================

function setCookie(name, value, days) {
    var expires = '';
    if (days) {
        var date = new Date();
        date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
        expires = '; expires=' + date.toUTCString();
    }
    document.cookie = name + '=' + value + expires + '; path=/; SameSite=Strict; Secure';
}

function getCookie(name) {
    var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? match[2] : null;
}

function accepterCookies() {
    setCookie('cookies_acceptes', 'true', 365);
    document.getElementById('cookie-banner').style.display = 'none';
    // Recharger la page pour enlever la bannière proprement
    location.reload();
}

function refuserCookies() {
    setCookie('cookies_acceptes', 'false', 365);
    document.getElementById('cookie-banner').style.display = 'none';
    // Recharger la page pour enlever la bannière proprement
    location.reload();
}

// ============================================================
// EXÉCUTION IMMÉDIATE — VÉRIFICATION DU COOKIE
// ============================================================

(function() {
    var consentement = getCookie('cookies_acceptes');
    
    if (!consentement) {
        // Pas de consentement → afficher la bannière
        document.getElementById('cookie-banner').style.display = 'flex';
        console.log('🍪 Bannière affichée (pas de consentement)');
    } else {
        // Consentement déjà donné → bannière cachée
        document.getElementById('cookie-banner').style.display = 'none';
        console.log('🍪 Bannière cachée (consentement: ' + consentement + ')');
    }
})();
</script>

    <script src="js/app.js"></script>
    <script>
        // Fonction pour le menu mobile
        function toggleMobileMenu() {
            const sidebar = document.querySelector('.sidebar');
            if (sidebar) {
                sidebar.classList.toggle('open');
            }
        }

        // Fermer le menu quand on clique ailleurs (mobile)
        document.addEventListener('click', function(e) {
            const sidebar = document.querySelector('.sidebar');
            const menuBtn = document.querySelector('.mobile-menu-btn');
            if (window.innerWidth <= 768) {
                if (sidebar && menuBtn && !sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
                    sidebar.classList.remove('open');
                }
            }
        });
    </script>

    <!-- Menu hamburger pour mobile -->
<!-- Menu hamburger mobile -->
<script>
(function() {
    // Créer l'overlay
    const overlay = document.createElement('div');
    overlay.className = 'sidebar-overlay';
    document.body.appendChild(overlay);
    
    // Fonction pour ouvrir/fermer le menu
    window.toggleMobileMenu = function() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        if (sidebar) {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
            // Empêcher le scroll du body quand menu ouvert
            if (sidebar.classList.contains('open')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        }
    };
    
    // Fermer le menu quand on clique sur l'overlay
    overlay.addEventListener('click', function() {
        const sidebar = document.querySelector('.sidebar');
        if (sidebar) {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }
    });
    
    // Fermer le menu quand on clique sur un lien du menu
    document.addEventListener('click', function(e) {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        if (window.innerWidth <= 768 && sidebar && sidebar.classList.contains('open')) {
            if (e.target.closest('.nav-item')) {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }
        }
    });
    
    // Réinitialiser le menu quand la fenêtre redimensionne
    window.addEventListener('resize', function() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        if (window.innerWidth > 768 && sidebar) {
            sidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('active');
            document.body.style.overflow = '';
        }
    });
})();
</script>
